<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🔥 消防灭火 - 策略游戏</title>
    <link rel="stylesheet" href="css/style.css?v=8">
    <link rel="stylesheet" href="css/new-features.css?v=1">
    <link rel="stylesheet" href="css/settings.css?v=1">
    <link rel="stylesheet" href="css/facilities.css?v=1">
</head>
<body>
    <div id="game-container">
        <!-- 游戏画布 -->
        <canvas id="game-canvas" width="800" height="600"></canvas>

        <!-- 顶部HUD -->
        <div id="top-hud" class="hud-panel" style="display: none;">
            <div class="hud-item">
                <span class="hud-label">⏱️ 时间</span>
                <span class="hud-value" id="time-display">01:00</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">💧 水量</span>
                <span class="hud-value" id="water-display">1000</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">🏆 得分</span>
                <span class="hud-value" id="score-display">0</span>
            </div>
        </div>

        <!-- 底部控制条 -->
        <div id="bottom-hud" class="hud-panel" style="display: none;">
            <div class="control-item">
                <span class="hud-label">角度</span>
                <div class="control-bar">
                    <div class="control-fill" id="angle-fill" style="width: 56%;"></div>
                </div>
                <span class="hud-value" id="angle-display" style="font-size: 16px;">45°</span>
            </div>
            <div class="control-item">
                <span class="hud-label">力度</span>
                <div class="control-bar">
                    <div class="control-fill" id="power-fill" style="width: 50%;"></div>
                </div>
                <span class="hud-value" id="power-display" style="font-size: 16px;">50%</span>
            </div>
        </div>

        <!-- 设施侧边栏 -->
        <div id="sidebar" class="hud-panel" style="display: none;">
            <div class="facility-category-tabs">
                <button class="category-tab active" data-category="basic">🔧 基础</button>
                <button class="category-tab" data-category="advanced">⭐ 高级</button>
                <button class="category-tab" data-category="special">🌟 特殊</button>
                <button class="category-tab" data-category="support">🎯 辅助</button>
            </div>
            <div id="facility-grid" class="facility-grid">
                <!-- 设施按钮将通过JS动态生成 -->
            </div>
        </div>

        <!-- 移动端控制按钮 -->
        <div id="mobile-controls" class="mobile-controls" style="display: none;">
            <div class="control-row">
                <button class="ctrl-btn" id="btn-up">▲</button>
            </div>
            <div class="control-row">
                <button class="ctrl-btn" id="btn-left">◀</button>
                <button class="ctrl-btn fire-btn" id="btn-fire">💧 发射</button>
                <button class="ctrl-btn" id="btn-right">▶</button>
            </div>
            <div class="control-row">
                <button class="ctrl-btn" id="btn-down">▼</button>
            </div>
        </div>

        <!-- 准备阶段提示 -->
        <div id="prepare-message" style="display: none; position: absolute; top: 5px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="font-size: 14px; color: #fff; text-align: center; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 10px; display: flex; align-items: center; gap: 15px;">
                <span>🎯 准备阶段（可选）</span>
                <button id="btn-skip" onclick="window.skipPrepare && window.skipPrepare()" style="
                    background: linear-gradient(135deg, #27ae60, #2ecc71);
                    border: none;
                    border-radius: 15px;
                    padding: 8px 20px;
                    color: #fff;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                ">⚡ 开始战斗</button>
            </div>
        </div>
        <div id="prepare-timer" style="display: none;">30</div>

        <!-- 主菜单 -->
        <div id="main-menu" class="menu-overlay">
            <div class="menu-title">
                <span class="fire-icon">🔥</span> 消防灭火 <span class="fire-icon">🔥</span>
            </div>
            <div class="menu-subtitle">策略灭火游戏</div>
            
            <!-- 玩法说明 -->
            <div class="tutorial-card">
                <h3>📖 游戏玩法</h3>
                <div class="tutorial-step">
                    <div class="step-icon">1</div>
                    <div><strong>准备阶段</strong> - 点击右侧设施，在画面上点击放置</div>
                </div>
                <div class="tutorial-step">
                    <div class="step-icon">2</div>
                    <div><strong>战斗阶段</strong> - 用方向键调整角度和力度，按发射灭火</div>
                </div>
                <div class="tutorial-step">
                    <div class="step-icon">3</div>
                    <div><strong>目标</strong> - 在时间耗尽前熄灭所有火焰！</div>
                </div>
            </div>
            
            <div class="menu-buttons">
                <button class="menu-btn" id="btn-play">🚒 开始游戏</button>
                <button class="menu-btn secondary" id="btn-levels">📋 选择关卡</button>
                <button class="menu-btn secondary" id="btn-challenge">🏅 挑战模式</button>
                <button class="menu-btn secondary" id="btn-daily">📅 每日挑战</button>
                <button class="menu-btn secondary" id="btn-powerup-shop">🎁 道具商店</button>
                <button class="menu-btn secondary" id="btn-upgrade">⬆️ 升级中心</button>
                <button class="menu-btn secondary" id="btn-vehicle">🚒 消防车库</button>
                <button class="menu-btn secondary" id="btn-achievements">🏆 成就</button>
                <button class="menu-btn secondary" id="btn-leaderboard">📊 排行榜</button>
                <button class="menu-btn secondary" id="btn-settings">⚙️ 设置</button>
            </div>
        </div>

        <!-- 关卡选择 -->
        <div id="level-menu" class="menu-overlay" style="display: none;">
            <div class="menu-title">📋 选择关卡</div>
            <div id="level-grid"></div>
            <button class="menu-btn secondary" id="btn-back">← 返回</button>
        </div>

        <!-- 结果界面 -->
        <div id="result-menu" class="menu-overlay" style="display: none;">
            <div class="result-title" id="result-title">🎉 胜利!</div>
            <div class="result-stars" id="result-stars">⭐⭐⭐</div>
            <div class="result-stats">
                <div class="result-stat">🏆 得分: <span id="result-score">0</span></div>
                <div class="result-stat">💧 剩余水量: <span id="result-water">0</span></div>
                <div class="result-stat">🏠 保存建筑: <span id="result-buildings">0</span></div>
            </div>
            <div class="menu-buttons">
                <button class="menu-btn" id="btn-retry">🔄 重试</button>
                <button class="menu-btn secondary" id="btn-next">➡️ 下一关</button>
                <button class="menu-btn secondary" id="btn-menu">🏠 主菜单</button>
            </div>
        </div>

        <!-- 挑战模式界面 -->
        <div id="challenge-menu" class="menu-overlay" style="display: none;">
            <div class="menu-title">🏅 挑战模式</div>
            <div id="challenge-level-select" style="margin: 20px 0;">
                <label style="color: #fff; margin-right: 10px;">选择关卡:</label>
                <select id="challenge-level-dropdown" style="padding: 8px 15px; font-size: 14px; border-radius: 5px;">
                </select>
            </div>
            <div id="challenge-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0;"></div>
            <button class="menu-btn secondary" id="btn-back-challenge">← 返回</button>
        </div>

        <!-- 道具商店界面 -->
        <div id="powerup-shop" class="menu-overlay" style="display: none;">
            <div class="menu-title">🎁 道具商店</div>
            <div style="color: #FFD700; font-size: 18px; margin: 10px 0;">
                💰 当前金币: <span id="shop-coins">0</span>
            </div>
            <div id="powerup-list" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; max-height: 400px; overflow-y: auto;"></div>
            <button class="menu-btn secondary" id="btn-back-shop">← 返回</button>
        </div>

        <!-- 成就界面 -->
        <div id="achievement-menu" class="menu-overlay" style="display: none;">
            <div class="menu-title">🏆 成就</div>
            <div style="color: #fff; margin: 10px 0;">
                已解锁: <span id="achievement-progress">0</span> / <span id="achievement-total">0</span>
            </div>
            <div id="achievement-list" style="display: grid; grid-template-columns: 1fr; gap: 10px; margin: 20px 0; max-height: 450px; overflow-y: auto;"></div>
            <button class="menu-btn secondary" id="btn-back-achievement">← 返回</button>
        </div>

        <!-- 排行榜界面 -->
        <div id="leaderboard-menu" class="menu-overlay" style="display: none;">
            <div class="menu-title">📊 排行榜</div>
            <div id="leaderboard-tabs" style="display: flex; gap: 10px; margin: 15px 0;">
                <button class="tab-btn active" data-tab="levels">关卡记录</button>
                <button class="tab-btn" data-tab="stats">总体统计</button>
            </div>
            <div id="leaderboard-content" style="max-height: 450px; overflow-y: auto;"></div>
            <button class="menu-btn secondary" id="btn-back-leaderboard">← 返回</button>
        </div>

        <!-- 升级中心界面 -->
        <div id="upgrade-menu" class="menu-overlay" style="display: none;">
            <div class="menu-title">⬆️ 升级中心</div>
            <div id="upgrade-list" style="max-height: 500px; overflow-y: auto; padding: 10px;"></div>
            <button class="menu-btn secondary" id="btn-back-upgrade">← 返回</button>
        </div>

        <!-- 消防车库界面 -->
        <div id="vehicle-menu" class="menu-overlay" style="display: none;">
            <div class="menu-title">🚒 消防车库</div>
            <div id="vehicle-list" style="max-height: 500px; overflow-y: auto; padding: 10px;"></div>
            <button class="menu-btn secondary" id="btn-back-vehicle">← 返回</button>
        </div>

        <!-- 设置界面 -->
        <div id="settings-menu" class="menu-overlay" style="display: none;">
            <div class="menu-title">⚙️ 设置</div>
            <div id="settings-list" style="max-height: 500px; overflow-y: auto; padding: 10px;"></div>
            <button class="menu-btn secondary" id="btn-back-settings">← 返回</button>
        </div>

        <!-- 每日挑战界面 -->
        <div id="daily-menu" class="menu-overlay" style="display: none;">
            <div class="menu-title">📅 每日挑战</div>
            <div id="daily-content" style="max-height: 500px; overflow-y: auto; padding: 10px;"></div>
            <button class="menu-btn secondary" id="btn-back-daily">← 返回</button>
        </div>

        <!-- 天气选择界面 -->
        <div id="weather-select" class="menu-overlay" style="display: none;">
            <div class="menu-title">🌤️ 选择天气</div>
            <div id="weather-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0;"></div>
            <button class="menu-btn secondary" id="btn-back-weather">← 返回</button>
        </div>
    </div>

    <!-- 游戏脚本 -->
    <script src="js/constants.js"></script>
    <script src="js/challenge.js"></script>
    <script src="js/powerup.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/achievement.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/rescue.js"></script>
    <script src="js/upgrade.js"></script>
    <script src="js/special-events.js"></script>
    <script src="js/vehicle.js"></script>
    <script src="js/extended-facilities.js"></script>
    <script src="js/game-optimizer.js"></script>
    <script src="js/enhanced-systems.js"></script>
    <script src="js/settings-system.js"></script>
    <script src="js/game-integration.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
